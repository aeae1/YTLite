name: Create free YouTube Plus app
'on':
  workflow_dispatch:
    inputs:
      enable_youpip:
        description: Integrate YouPiP
        type: boolean
        required: true
        default: false
      enable_ytuhd:
        description: Integrate YTUHD
        type: boolean
        required: true
        default: false
      enable_yq:
        description: Integrate YouQuality
        type: boolean
        required: true
        default: false
      enable_ryd:
        description: Integrate Return YouTube Dislikes
        type: boolean
        required: true
        default: false
      enable_ytabc:
        description: Integrate YTABConfig
        type: boolean
        required: true
        default: false
      enable_demc:
        description: Integrate DontEatMyContent
        type: boolean
        required: true
        default: false
      enable_localization:
        description: Update localization files from repo
        type: boolean
        required: true
        default: false
      ipa_url:
        description: URL to the decrypted IPA file
        default: ''
        required: true
        type: string
      display_name:
        description: App Name (Optional)
        default: YouTube
        required: true
        type: string
      bundle_id:
        description: BundleID (Optional)
        default: com.google.ios.youtube
        required: true
        type: string
      info_note:
        description: 'TIP: Learn more about integrations in the README via the link below'
        default: https://github.com/dayanch96/YTLite#tweak-integration-details
        type: string
        required: false
      enable_safari:
        description: Include Open in YouTube Safari extension
        type: boolean
        required: true
        default: false
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-tweaks:
    uses: ./.github/workflows/_build_tweaks.yml
    with:
      enable_youpip: ${{ inputs.enable_youpip }}
      enable_ytuhd: ${{ inputs.enable_ytuhd }}
      enable_yq: ${{ inputs.enable_yq }}
      enable_ryd: ${{ inputs.enable_ryd }}
      enable_ytabc: ${{ inputs.enable_ytabc }}
      enable_demc: ${{ inputs.enable_demc }}
      enable_localization: ${{ inputs.enable_localization }}
      enable_safari: ${{ inputs.enable_safari }}
  package:
    name: Package IPA
    runs-on: macos-15-intel
    needs: build-tweaks
    env:
      DISPLAY_NAME: ${{ inputs.display_name }}
      BUNDLE_ID: ${{ inputs.bundle_id }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: built-debs
    - name: Install package reader
      run: brew install dpkg
    - name: Verify the incoming artifact inventory
      run: python3 scripts/build_artifacts.py verify . built-inputs.json
    - name: Download and validate the base IPA
      env:
        IPA_URL: ${{ inputs.ipa_url }}
      run: python3 scripts/prepare_ipa.py --download source.ipa youtube.ipa
    - name: Fetch the reviewed packager
      run: python3 scripts/supply_chain.py source cyan vendor/cyan
    - name: Package verified inputs
      run: python3 scripts/package_app.py ipa
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: packaged-app
        path: |
          YouTubePlus_6.0-free1.ipa
          free-build-report.json
          built-inputs.json
        if-no-files-found: error
        retention-days: 3
  release:
    name: Save draft release
    runs-on: ubuntu-24.04
    needs: package
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: packaged-app
    - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
      with:
        tag_name: ytp-${{ github.run_number }}
        name: YouTubePlus v6.0-free1 (${{ github.run_number }})
        files: |
          YouTubePlus_6.0-free1.ipa
          free-build-report.json
          built-inputs.json
        draft: true
permissions:
  contents: read
