name: Build Tweaks (Helper)
'on':
  workflow_call:
    inputs:
      enable_youpip:
        type: boolean
        required: false
        default: false
      enable_ytuhd:
        type: boolean
        required: false
        default: false
      enable_yq:
        type: boolean
        required: false
        default: false
      enable_ryd:
        type: boolean
        required: false
        default: false
      enable_ytabc:
        type: boolean
        required: false
        default: false
      enable_demc:
        type: boolean
        required: false
        default: false
      enable_localization:
        type: boolean
        required: false
        default: false
      enable_safari:
        type: boolean
        required: false
        default: false
jobs:
  build-tweaks:
    name: Build Tweaks
    runs-on: macos-15-intel
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install platform build tools
      run: brew install make ldid dpkg
    - name: Set build paths
      run: |
        echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
        echo "THEOS=$GITHUB_WORKSPACE/theos" >> "$GITHUB_ENV"
    - name: Fetch the reviewed core package
      run: python3 scripts/supply_chain.py asset ytplus_6_0 ytplus.deb
    - name: Build the offline core
      env:
        UPDATE_LOCALIZATION: ${{ inputs.enable_localization }}
      run: |
        args=()
        if [ "$UPDATE_LOCALIZATION" = "true" ]; then
          args+=(--localizations "layout/Library/Application Support/YTLite.bundle")
        fi
        python3 scripts/free_ytplus.py ytplus.deb "${args[@]}"
        python3 scripts/build_artifacts.py core ytplus.deb .verified-core
        codesign --verify --verbose=2 .verified-core/Library/MobileSubstrate/DynamicLibraries/YTLite.dylib
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      name: Checkout the pinned Theos toolchain
      if: ${{ inputs.enable_youpip || inputs.enable_ytuhd || inputs.enable_yq || inputs.enable_ryd || inputs.enable_ytabc || inputs.enable_demc
        }}
      with:
        repository: theos/theos
        ref: 9bc73406cf80b711ef4d02c15ff1dedc4478a275
        path: theos
        submodules: recursive
        persist-credentials: false
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      name: Checkout the pinned iOS SDK
      if: ${{ inputs.enable_youpip || inputs.enable_ytuhd || inputs.enable_yq || inputs.enable_ryd || inputs.enable_ytabc || inputs.enable_demc
        }}
      with:
        repository: theos/sdks
        ref: 0222fd5413cf4b9af096f37b4621afa2688572f7
        path: theos/sdks
        sparse-checkout: iPhoneOS16.5.sdk
        persist-credentials: false
    - name: Fetch reviewed headers
      if: ${{ inputs.enable_youpip || inputs.enable_ytuhd || inputs.enable_yq || inputs.enable_ryd || inputs.enable_ytabc || inputs.enable_demc
        }}
      run: |
        python3 scripts/supply_chain.py source youtube_headers vendor/YouTubeHeader
        python3 scripts/supply_chain.py source ps_headers vendor/PSHeader
        rm -rf "$THEOS/include/YouTubeHeader" "$THEOS/include/PSHeader"
        cp -R vendor/YouTubeHeader "$THEOS/include/YouTubeHeader"
        cp -R vendor/PSHeader "$THEOS/include/PSHeader"
    - name: Provide the reviewed legacy header alias
      if: ${{ inputs.enable_demc }}
      run: |
        rm -rf "$THEOS/include/YTHeaders"
        cp -R vendor/YouTubeHeader "$THEOS/include/YTHeaders"
    - name: Fetch reviewed YouPiP
      if: ${{ inputs.enable_youpip }}
      run: python3 scripts/supply_chain.py source youpip vendor/YouPiP
    - name: Fetch reviewed YTUHD
      if: ${{ inputs.enable_ytuhd }}
      run: python3 scripts/supply_chain.py source ytuhd vendor/YTUHD
    - name: Fetch reviewed Return-YouTube-Dislikes
      if: ${{ inputs.enable_ryd }}
      run: python3 scripts/supply_chain.py source ryd vendor/Return-YouTube-Dislikes
    - name: Fetch reviewed YTABConfig
      if: ${{ inputs.enable_ytabc }}
      run: python3 scripts/supply_chain.py source ytabc vendor/YTABConfig
    - name: Fetch reviewed YouQuality
      if: ${{ inputs.enable_yq }}
      run: python3 scripts/supply_chain.py source quality vendor/YouQuality
    - name: Fetch reviewed DontEatMyContent
      if: ${{ inputs.enable_demc }}
      run: python3 scripts/supply_chain.py source dont_eat_content vendor/DontEatMyContent
    - name: Fetch reviewed YouGroupSettings
      if: ${{ inputs.enable_youpip || inputs.enable_ytuhd || inputs.enable_yq || inputs.enable_ryd || inputs.enable_ytabc || inputs.enable_demc
        }}
      run: python3 scripts/supply_chain.py source group_settings vendor/YouGroupSettings
    - name: Fetch reviewed YTVideoOverlay
      if: ${{ inputs.enable_youpip || inputs.enable_ytuhd || inputs.enable_yq }}
      run: python3 scripts/supply_chain.py source video_overlay vendor/YTVideoOverlay
    - name: Build YouPiP
      if: ${{ inputs.enable_youpip }}
      run: |
        cd vendor/YouPiP
        make clean package DEBUG=0 FINALPACKAGE=1
        packages=(packages/*.deb)
        [ "${#packages[@]}" -eq 1 ] && [ -f "${packages[0]}" ]
        cp "${packages[0]}" "../../youpip.deb"
    - name: Build YTUHD
      if: ${{ inputs.enable_ytuhd }}
      run: |
        cd vendor/YTUHD
        make clean package DEBUG=0 FINALPACKAGE=1
        packages=(packages/*.deb)
        [ "${#packages[@]}" -eq 1 ] && [ -f "${packages[0]}" ]
        cp "${packages[0]}" "../../ytuhd.deb"
    - name: Build Return-YouTube-Dislikes
      if: ${{ inputs.enable_ryd }}
      run: |
        cd vendor/Return-YouTube-Dislikes
        make clean package DEBUG=0 FINALPACKAGE=1
        packages=(packages/*.deb)
        [ "${#packages[@]}" -eq 1 ] && [ -f "${packages[0]}" ]
        cp "${packages[0]}" "../../ryd.deb"
    - name: Build YTABConfig
      if: ${{ inputs.enable_ytabc }}
      run: |
        cd vendor/YTABConfig
        make clean package DEBUG=0 FINALPACKAGE=1
        packages=(packages/*.deb)
        [ "${#packages[@]}" -eq 1 ] && [ -f "${packages[0]}" ]
        cp "${packages[0]}" "../../ytabc.deb"
    - name: Build YouQuality
      if: ${{ inputs.enable_yq }}
      run: |
        cd vendor/YouQuality
        make clean package DEBUG=0 FINALPACKAGE=1
        packages=(packages/*.deb)
        [ "${#packages[@]}" -eq 1 ] && [ -f "${packages[0]}" ]
        cp "${packages[0]}" "../../yq.deb"
    - name: Build DontEatMyContent
      if: ${{ inputs.enable_demc }}
      run: |
        cd vendor/DontEatMyContent
        make clean package DEBUG=0 FINALPACKAGE=1
        packages=(packages/*.deb)
        [ "${#packages[@]}" -eq 1 ] && [ -f "${packages[0]}" ]
        cp "${packages[0]}" "../../demc.deb"
    - name: Build YouGroupSettings
      if: ${{ inputs.enable_youpip || inputs.enable_ytuhd || inputs.enable_yq || inputs.enable_ryd || inputs.enable_ytabc || inputs.enable_demc
        }}
      run: |
        cd vendor/YouGroupSettings
        make clean package DEBUG=0 FINALPACKAGE=1
        packages=(packages/*.deb)
        [ "${#packages[@]}" -eq 1 ] && [ -f "${packages[0]}" ]
        cp "${packages[0]}" "../../ygs.deb"
    - name: Build YTVideoOverlay
      if: ${{ inputs.enable_youpip || inputs.enable_ytuhd || inputs.enable_yq }}
      run: |
        cd vendor/YTVideoOverlay
        make clean package DEBUG=0 FINALPACKAGE=1
        packages=(packages/*.deb)
        [ "${#packages[@]}" -eq 1 ] && [ -f "${packages[0]}" ]
        cp "${packages[0]}" "../../ytvo.deb"
    - name: Fetch the reviewed optional Safari extension
      if: ${{ inputs.enable_safari }}
      run: |
        python3 scripts/supply_chain.py source safari vendor/SafariExtension
        cp -R vendor/SafariExtension/OpenYouTubeSafariExtension.appex .
    - name: Record exact build artifacts
      run: python3 scripts/build_artifacts.py write . built-inputs.json
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      name: Upload verified build inputs
      with:
        name: built-debs
        path: |
          *.deb
          OpenYouTubeSafariExtension.appex
          free-build-report.json
          built-inputs.json
        if-no-files-found: error
        retention-days: 1
permissions:
  contents: read
