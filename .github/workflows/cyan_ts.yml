name: Generate free TrollFools/Cyan files
'on':
  workflow_dispatch:
    inputs:
      create_cyan:
        description: Generate .cyan file
        type: boolean
        required: true
        default: true
      create_tf:
        description: Generate .zip for TrollFools
        type: boolean
        required: true
        default: true
      enable_youpip:
        description: Integrate YouPiP
        type: boolean
        required: true
        default: false
      enable_ytuhd:
        description: Integrate YTUHD
        type: boolean
        required: true
        default: false
      enable_yq:
        description: Integrate YouQuality
        type: boolean
        required: true
        default: false
      enable_ryd:
        description: Integrate Return YouTube Dislikes
        type: boolean
        required: true
        default: false
      enable_ytabc:
        description: Integrate YTABConfig
        type: boolean
        required: true
        default: false
      enable_demc:
        description: Integrate DontEatMyContent
        type: boolean
        required: true
        default: false
      display_name:
        description: App Name (Optional)
        default: YouTube
        required: true
        type: string
      bundle_id:
        description: BundleID (Optional)
        default: com.google.ios.youtube
        required: true
        type: string
      enable_safari:
        description: Include Open in YouTube Safari extension in the Cyan file
        type: boolean
        required: true
        default: false
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-tweaks:
    if: ${{ inputs.create_cyan || inputs.create_tf }}
    uses: ./.github/workflows/_build_tweaks.yml
    with:
      enable_youpip: ${{ inputs.enable_youpip }}
      enable_ytuhd: ${{ inputs.enable_ytuhd }}
      enable_yq: ${{ inputs.enable_yq }}
      enable_ryd: ${{ inputs.enable_ryd }}
      enable_ytabc: ${{ inputs.enable_ytabc }}
      enable_demc: ${{ inputs.enable_demc }}
      enable_localization: false
      enable_safari: ${{ inputs.enable_safari }}
  package:
    name: Generate Cyan/TrollFools
    runs-on: macos-15-intel
    needs: build-tweaks
    if: ${{ inputs.create_cyan || inputs.create_tf }}
    env:
      DISPLAY_NAME: ${{ inputs.display_name }}
      BUNDLE_ID: ${{ inputs.bundle_id }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: built-debs
    - name: Install package reader
      run: brew install dpkg
    - name: Verify incoming build artifacts
      run: python3 scripts/build_artifacts.py verify . built-inputs.json
    - name: Fetch the reviewed packager
      if: ${{ inputs.create_cyan }}
      run: python3 scripts/supply_chain.py source cyan vendor/cyan
    - name: Generate Cyan file
      if: ${{ inputs.create_cyan }}
      run: python3 scripts/package_app.py cyan
    - name: Generate TrollFools ZIP
      if: ${{ inputs.create_tf }}
      run: python3 scripts/package_app.py trollfools
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: packaged-tweaks
        path: |
          cyan_YouTubePlus_6.0-free1.cyan
          TrollFools_YouTubePlus_6.0-free1.zip
          free-build-report.json
          built-inputs.json
        if-no-files-found: error
        retention-days: 3
  release:
    name: Save draft release
    runs-on: ubuntu-24.04
    needs: package
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: packaged-tweaks
    - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
      with:
        tag_name: ytp-cyan-${{ github.run_number }}
        name: YouTubePlus v6.0-free1 Cyan/TrollFools (${{ github.run_number }})
        files: |
          *.cyan
          TrollFools_YouTubePlus_6.0-free1.zip
          free-build-report.json
          built-inputs.json
        draft: true
permissions:
  contents: read
